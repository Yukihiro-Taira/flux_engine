[package]
name = "flux_engine"
version = "0.1.2"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
anyhow = "1"
winit = {version = "0.30", features = ["android-native-activity"]}
env_logger = "0.10"
log = "0.4"
wgpu = "29.0"
egui = "0.35"
egui-winit = "0.35"
egui-wgpu = "0.35"
pollster = "0.3"
bytemuck = {version = "1.24", features = [ "derive"]}
cgmath = "0.18"
exr = "1.74"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1"
bincode = "1.3"
tobj = { version = "3.2", default-features = false, features = ["async"]}

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg", "hdr", "exr"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
ufbx = "0.11.3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flux_engine"
path = "src/main.rs"

# Keep normal `cargo run` interactive while retaining debug information.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "29.0", features =["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
reqwest = { version = "0.11"}
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
